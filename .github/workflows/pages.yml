name: Pages

on:
  push:
    branches: [main]
    paths:
      - "demo-ui.html"
      - "docs/control-path.svg"
      - "docs/demo.gif"
      - "docs/readme-visuals/**"
      - "scripts/generate_readme_visuals.py"
      - "scripts/render_svg_to_png.swift"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp demo-ui.html _site/index.html
          cp docs/control-path.svg _site/
          cp docs/demo.gif _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
