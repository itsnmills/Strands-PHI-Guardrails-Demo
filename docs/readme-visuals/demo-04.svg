<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">PHI Guardrails system overview</title><desc id="desc">Synthetic-data illustration of deterministic policy enforcement before a tool runs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0d8b68"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163b2f" flood-opacity=".07"/></filter></defs><rect width="1440" height="860" fill="#f3f7f5"/><circle cx="1360" cy="38" r="210" fill="#e7f4ee" opacity=".72"/><circle cx="15" cy="850" r="220" fill="#eaf1ee" opacity=".58"/><path d="M71 37 L85 42 V55 C85 65 78 71 71 75 C64 71 57 65 57 55 V42 Z" fill="#d9f4e9" stroke="#0d8b68" stroke-width="1.5"/><path d="M64 55 l5 5 9 -10" fill="none" stroke="#0d8b68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="52" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#152721" letter-spacing="1.5" text-anchor="start">PHI GUARDRAILS</text><text x="98" y="74" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#63736d" letter-spacing="0.65" text-anchor="start">SYNTHETIC FEATURE WALKTHROUGH</text><rect x="1215" y="36" width="76" height="25" rx="12.5" fill="#d9f4e9"/><text x="1253" y="53" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">04 / 04</text><text x="56" y="133" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#152721" letter-spacing="0" text-anchor="start">Jev annotates ambiguity. Policy keeps the verdict.</text><text x="56" y="163" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="450" fill="#63736d" letter-spacing="0" text-anchor="start">For a separate unknown-vendor case, Jev adds context without changing the block.</text><rect x="54" y="194" width="320" height="444" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="76" y="228" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="start">REQUEST CONTEXT</text><text x="76" y="281" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">ACTOR</text><text x="76" y="305" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Physician</text><path d="M76 323 H352" stroke="#dce6e1"/><text x="76" y="350" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">PURPOSE</text><text x="76" y="374" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Treatment</text><path d="M76 392 H352" stroke="#dce6e1"/><text x="76" y="419" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">TOOL</text><text x="76" y="443" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">send_data_to_vendor</text><path d="M76 461 H352" stroke="#dce6e1"/><text x="76" y="488" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">DESTINATION</text><text x="76" y="512" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">healthstart-ai</text><rect x="72" y="568" width="284" height="51" rx="12" fill="#f4f8f6" stroke="#e7efeb" stroke-width="1"/><text x="85" y="599" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Separate example: an unknown destination.</text><rect x="394" y="194" width="566" height="444" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="416" y="228" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="start">DETERMINISTIC CONTROL TRACE</text><rect x="412" y="261" width="530" height="91" rx="14" fill="#fff2d9" stroke="#f0dcaf" stroke-width="1"/><text x="432" y="291" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#a96d12" letter-spacing="0.6" text-anchor="start">AMBIGUITY FLAG</text><text x="432" y="323" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">unknown_vendor</text><rect x="412" y="368" width="530" height="116" rx="14" fill="#f4f8f6" stroke="#e4ede8" stroke-width="1"/><text x="432" y="400" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.6" text-anchor="start">JEV ANNOTATION</text><text x="432" y="433" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Destination classified as external egress</text><text x="432" y="460" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Typed signal only · no policy authority</text><rect x="412" y="501" width="530" height="104" rx="14" fill="#fce9e7" stroke="#f0cecb" stroke-width="1"/><text x="432" y="534" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#c84943" letter-spacing="0.6" text-anchor="start">ENGINE OUTCOME</text><text x="432" y="570" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#c84943" letter-spacing="0" text-anchor="start">BLOCKED · escalate for review</text><text x="432" y="591" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Jev cannot change the outcome, rule, or reason.</text><rect x="980" y="194" width="406" height="444" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="1002" y="228" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="start">OUTCOME</text><rect x="998" y="264" width="370" height="150" rx="14" fill="#fff2d9" stroke="#f0dcaf" stroke-width="1"/><rect x="1018" y="281" width="76" height="25" rx="12.5" fill="#fae6bd"/><text x="1056" y="298" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#a96d12" letter-spacing="0.7" text-anchor="middle">ESCALATE</text><text x="1018" y="352" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Jev adds an annotation.</text><text x="1018" y="384" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">The engine&#x27;s block stays in force.</text><text x="1002" y="464" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0" text-anchor="start">CONTROL OWNER</text><text x="1002" y="492" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Policy code sets lane + verdict.</text><text x="1002" y="522" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">No model override branch exists.</text><rect x="54" y="669" width="1332" height="127" rx="18" fill="#132923" stroke="#132923" stroke-width="1"/><circle cx="83" cy="710" r="5" fill="#a8e8ca"/><text x="98" y="714" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#a8e8ca" letter-spacing="0.65" text-anchor="start">SESSION VELOCITY</text><text x="78" y="750" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#f1f7f4" letter-spacing="0" text-anchor="start">5-minute rolling window</text><circle cx="510" cy="710" r="5" fill="#f3d59b"/><text x="525" y="714" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#f3d59b" letter-spacing="0.65" text-anchor="start">BREAK-GLASS</text><text x="505" y="750" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#f1f7f4" letter-spacing="0" text-anchor="start">Scoped · 20+ char justification · 15-minute expiry</text><circle cx="970" cy="710" r="5" fill="#a8e8ca"/><text x="985" y="714" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#a8e8ca" letter-spacing="0.65" text-anchor="start">POLICY MATRIX</text><text x="965" y="750" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="550" fill="#f1f7f4" letter-spacing="0" text-anchor="start">16 synthetic regression cases</text><text x="54" y="830" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Synthetic walkthrough · no real patient data</text><text x="1386" y="830" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.6" text-anchor="end">DECISION FLOW  /  FEATURES</text></svg>