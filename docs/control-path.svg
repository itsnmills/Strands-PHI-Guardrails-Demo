<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc"><title id="title">PHI Guardrails system overview</title><desc id="desc">Synthetic-data illustration of deterministic policy enforcement before a tool runs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0d8b68"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163b2f" flood-opacity=".07"/></filter></defs><rect width="1440" height="920" fill="#f3f7f5"/><circle cx="1360" cy="38" r="210" fill="#e7f4ee" opacity=".72"/><circle cx="15" cy="850" r="220" fill="#eaf1ee" opacity=".58"/><path d="M71 37 L85 42 V55 C85 65 78 71 71 75 C64 71 57 65 57 55 V42 Z" fill="#d9f4e9" stroke="#0d8b68" stroke-width="1.5"/><path d="M64 55 l5 5 9 -10" fill="none" stroke="#0d8b68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="52" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="750" fill="#152721" letter-spacing="1.5" text-anchor="start">PHI GUARDRAILS</text><text x="98" y="74" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#63736d" letter-spacing="0.7" text-anchor="start">POLICY-AS-CODE · HEALTHCARE AI</text><rect x="1214" y="36" width="151" height="25" rx="12.5" fill="#d9f4e9"/><text x="1289" y="53" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">SYNTHETIC DATA ONLY</text><text x="56" y="139" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="700" fill="#152721" letter-spacing="0" text-anchor="start">The verdict stays in policy code.</text><text x="56" y="174" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="450" fill="#63736d" letter-spacing="0" text-anchor="start">An agent can request a tool call. Six deterministic checks decide whether it runs.</text><path d="M318 399 H342" fill="none" stroke="#0d8b68" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M770 399 H790" fill="none" stroke="#0d8b68" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1056 399 H1074" fill="none" stroke="#0d8b68" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="218" width="270" height="376" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="70" y="249" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#63736d" letter-spacing="0.85" text-anchor="start">REQUEST</text><rect x="70" y="262" width="165" height="25" rx="12.5" fill="#d9f4e9"/><text x="152" y="279" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">BEFORE TOOL EXECUTION</text><text x="70" y="310" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Structured request context</text><text x="70" y="355" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">ROLE</text><text x="70" y="377" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Registered nurse</text><path d="M70 389 H296" stroke="#dce6e1"/><text x="70" y="409" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">PURPOSE</text><text x="70" y="431" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">Treatment</text><path d="M70 443 H296" stroke="#dce6e1"/><text x="70" y="463" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">TOOL</text><text x="70" y="485" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">query_patient_record</text><path d="M70 497 H296" stroke="#dce6e1"/><text x="70" y="517" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.7" text-anchor="start">TARGET</text><text x="70" y="539" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#152721" letter-spacing="0" text-anchor="start">P003 · restricted tier</text><rect x="348" y="196" width="422" height="398" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="370" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#63736d" letter-spacing="0.65" text-anchor="start">DETERMINISTIC POLICY ENGINE</text><rect x="648" y="210" width="130" height="25" rx="12.5" fill="#d9f4e9"/><text x="713" y="227" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">FIRST BLOCK WINS</text><circle cx="387" cy="269" r="13" fill="#d9f4e9"/><text x="387" y="273" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">01</text><text x="411" y="274" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Role-based access</text><text x="750" y="274" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Role scope</text><path d="M370 293 H748" stroke="#dce6e1"/><circle cx="387" cy="317" r="13" fill="#d9f4e9"/><text x="387" y="321" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">02</text><text x="411" y="322" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Purpose of use</text><text x="750" y="322" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Purpose + reason</text><path d="M370 341 H748" stroke="#dce6e1"/><circle cx="387" cy="365" r="13" fill="#d9f4e9"/><text x="387" y="369" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">03</text><text x="411" y="370" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Sensitivity tier</text><text x="750" y="370" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Patient category</text><path d="M370 389 H748" stroke="#dce6e1"/><circle cx="387" cy="413" r="13" fill="#d9f4e9"/><text x="387" y="417" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">04</text><text x="411" y="418" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">BAA registry</text><text x="750" y="418" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Approved destination</text><path d="M370 437 H748" stroke="#dce6e1"/><circle cx="387" cy="461" r="13" fill="#d9f4e9"/><text x="387" y="465" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">05</text><text x="411" y="466" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">PHI content scan</text><text x="750" y="466" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Outbound content</text><path d="M370 485 H748" stroke="#dce6e1"/><circle cx="387" cy="509" r="13" fill="#d9f4e9"/><text x="387" y="513" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" font-weight="700" fill="#0d8b68" letter-spacing="0" text-anchor="middle">06</text><text x="411" y="514" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Minimum necessary</text><text x="750" y="514" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="end">Request + session rate</text><rect x="792" y="218" width="264" height="376" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="814" y="253" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="start">DECISION</text><rect x="810" y="294" width="228" height="91" rx="14" fill="#eff8f3" stroke="#cde7d9" stroke-width="1"/><circle cx="835" cy="325" r="10" fill="#0d8b68"/><text x="835" y="329" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="middle">✓</text><text x="856" y="329" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="750" fill="#0d8b68" letter-spacing="0.7" text-anchor="start">ALLOW</text><text x="856" y="358" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="550" fill="#152721" letter-spacing="0" text-anchor="start">Tool may execute</text><rect x="810" y="404" width="228" height="103" rx="14" fill="#fce9e7" stroke="#f0cecb" stroke-width="1"/><circle cx="835" cy="435" r="10" fill="#c84943"/><text x="835" y="439" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0" text-anchor="middle">×</text><text x="856" y="439" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="750" fill="#c84943" letter-spacing="0.7" text-anchor="start">BLOCK</text><text x="856" y="468" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="550" fill="#152721" letter-spacing="0" text-anchor="start">Tool call stops here</text><text x="814" y="544" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Outcome and rule stay deterministic.</text><rect x="1074" y="218" width="318" height="376" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><text x="1096" y="253" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="start">AUDIT EVENT</text><text x="1096" y="300" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Every decision is recorded</text><text x="1096" y="327" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">allow · block · warn · break-glass</text><rect x="1092" y="357" width="282" height="100" rx="14" fill="#132923" stroke="#132923" stroke-width="1"/><text x="1110" y="389" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#a8e8ca" letter-spacing="0.7" text-anchor="start">HMAC-SHA256 CHAIN</text><text x="1110" y="418" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#f1f7f4" letter-spacing="0" text-anchor="start">event[n]  →  prev_hash</text><text x="1110" y="439" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#c5d6ce" letter-spacing="0" text-anchor="start">tamper check  →  verify_chain()</text><text x="1096" y="493" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Disclosure report</text><text x="1096" y="516" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">External sends + emergency grants</text><text x="1096" y="542" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Exportable for review · §164.528</text><rect x="48" y="625" width="422" height="204" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><circle cx="76" cy="656" r="6" fill="#0d8b68"/><text x="93" y="660" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="750" fill="#0d8b68" letter-spacing="0.8" text-anchor="start">SESSION VELOCITY</text><text x="70" y="708" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">5-minute rolling window</text><text x="70" y="742" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Warn at role budget · block at 2× budget</text><rect x="70" y="771" width="130" height="25" rx="12.5" fill="#d9f4e9"/><text x="135" y="788" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">REQUESTS + SENDS</text><rect x="509" y="625" width="422" height="204" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><circle cx="537" cy="656" r="6" fill="#a96d12"/><text x="554" y="660" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="750" fill="#a96d12" letter-spacing="0.8" text-anchor="start">BREAK-GLASS</text><text x="531" y="708" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Scoped emergency access</text><text x="531" y="742" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">One patient + role · 20+ char justification · 15-minute expiry</text><rect x="531" y="771" width="144" height="25" rx="12.5" fill="#fff2d9"/><text x="603" y="788" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#a96d12" letter-spacing="0.7" text-anchor="middle">FLAGGED FOR REVIEW</text><rect x="970" y="625" width="422" height="204" rx="18" fill="#ffffff" stroke="#dce6e1" stroke-width="1"/><circle cx="998" cy="656" r="6" fill="#0d8b68"/><text x="1015" y="660" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="750" fill="#0d8b68" letter-spacing="0.8" text-anchor="start">JEV ADVISORY</text><text x="992" y="708" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#152721" letter-spacing="0" text-anchor="start">Ambiguity only</text><text x="992" y="742" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Adds annotations. Code keeps the lane and verdict.</text><rect x="992" y="771" width="151" height="25" rx="12.5" fill="#d9f4e9"/><text x="1067" y="788" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0d8b68" letter-spacing="0.7" text-anchor="middle">NO VERDICT OVERRIDE</text><text x="48" y="876" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#63736d" letter-spacing="0" text-anchor="start">Synthetic examples · policy checks run before the tool call · no model answer can override a block</text><text x="1392" y="876" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#63736d" letter-spacing="0.8" text-anchor="end">STRANDS PHI GUARDRAILS</text></svg>